    openai:     { label: 'OpenAI TTS',    models: ['tts-1','tts-1-hd'],                            default: 'tts-1',            type: 'openai_tts' },
    playht:     { label: 'PlayHT',        models: ['PlayHT2.0-turbo','PlayHT2.0'],                 default: 'PlayHT2.0-turbo',  type: 'playht' },
    cartesia:   { label: 'Cartesia Sonic',models: ['sonic-english','sonic-multilingual'],           default: 'sonic-english',    type: 'cartesia' },
  };

  // ─── T3 · BYOK · STT providers ──────────────────────────────────────
  const STT_PROVIDERS = {
    deepgram:   { label: 'Deepgram Nova',     models: ['nova-2','nova-3'],                default: 'nova-2',     type: 'deepgram' },
    assemblyai: { label: 'AssemblyAI',        models: ['universal-1','best'],             default: 'universal-1',type: 'assemblyai' },
    openai:     { label: 'OpenAI Whisper',    models: ['whisper-1'],                      default: 'whisper-1',  type: 'openai_stt' },
  };

  // ─── State ──────────────────────────────────────────────────────────
  const MODALITIES = ['text', 'image', 'video', 'tts', 'stt'];
  const emptyKeys = () => ({ text: {}, image: {}, video: {}, tts: {}, stt: {} });
  /**
   * What a stored config holds, split into what may be stored (the tier, providers, models) and what is held in this
   * tab only (the keys). Keys stay stored only when the owner chose "remember my keys on this device"; a config written
   * the old way (keys stored, no choice made) has its keys moved into the tab and stored no longer. Pure.
   * → { config, secrets, moved } (moved: how many keys were taken out of storage)
   */
  function configFrom(c) {
    c = c && typeof c === 'object' && !Array.isArray(c) ? Object.assign({}, c) : {};
    if (c.api_key && !c.keys) {   // v1 → v2: one text key at the top level
      c.keys = emptyKeys();
      c.keys.text[c.api_provider || 'anthropic'] = { key: c.api_key, model: c.api_model };
    }
    delete c.api_key;
    const secrets = emptyKeys(), models = emptyKeys();
    let moved = 0;
    for (const m of MODALITIES) {
      const held = c.keys && c.keys[m] && typeof c.keys[m] === 'object' ? c.keys[m] : {};
      for (const pk of Object.keys(held)) {
        const e = held[pk] || {};
        if (typeof e.key === 'string' && e.key) { secrets[m][pk] = e.key; moved++; }
        if (typeof e.model === 'string' && e.model) models[m][pk] = e.model;
      }
      const kept = c.models && c.models[m] && typeof c.models[m] === 'object' ? c.models[m] : {};
      for (const pk of Object.keys(kept)) if (typeof kept[pk] === 'string' && kept[pk]) models[m][pk] = models[m][pk] || kept[pk];
    }
    c.models = models;
    const remember = c.remember_keys === true;
    if (!remember) delete c.keys;
    return { config: c, secrets: secrets, moved: remember ? 0 : moved };
  }
  /** what is written to storage: the config, with the keys only if the owner chose to remember them. Pure. */
  function storedForm(config, secrets) {
    const out = Object.assign({}, config);
    delete out.keys;
    if (config.remember_keys === true) {
      out.keys = emptyKeys();
      for (const m of MODALITIES) for (const pk of Object.keys(secrets[m] || {})) out.keys[m][pk] = { key: secrets[m][pk], model: (config.models && config.models[m] && config.models[m][pk]) || undefined };
    }
    return out;
  }
  const BOOT = (function () {
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem('fall-kit.config') || '{}'); } catch (e) { stored = {}; }
    return configFrom(stored);
  })();
  const STATE = {
    config: BOOT.config,
    secrets: BOOT.secrets,   // the keys: this tab only, unless remember_keys
    ai: { ready: false, loading: false, progress: 0, engine: null, model: null },
    mesh: { active: false, peers: new Map(), bc: null, signal: null, light: null, stats: { sent: 0, admitted: 0, legacy: 0, refused: {} } },
    lastUsage: null,
    ask: { opening: null, talk: [], last: null },   // the talk about this page: its opening, kept identical, and its turns
  };

  function saveConfig() { try { localStorage.setItem('fall-kit.config', JSON.stringify(storedForm(STATE.config, STATE.secrets))); } catch (e) {} }
  if (BOOT.moved) saveConfig();   // keys stored the old way leave shared storage now; they stay usable in this tab
  function getKey(modality, providerKey) { return (STATE.secrets[modality] && STATE.secrets[modality][providerKey]) || ''; }
  function getModel(modality, providerKey, registry) {
    return (STATE.config.models && STATE.config.models[modality] && STATE.config.models[modality][providerKey]) || registry[providerKey]?.default;
  }
  function setKey(modality, providerKey, key, model) {
    STATE.secrets[modality] = STATE.secrets[modality] || {};
    if (key) STATE.secrets[modality][providerKey] = key;
    STATE.config.models = STATE.config.models || emptyKeys();
    STATE.config.models[modality] = STATE.config.models[modality] || {};
    if (model) STATE.config.models[modality][providerKey] = model;
    saveConfig();
  }
  function forgetKeys() { STATE.secrets = emptyKeys(); STATE.config.remember_keys = false; saveConfig(); renderAiChip(); }

  // ─── DOM helpers ────────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ────────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }
  function activeTextProvider() { return STATE.config.text_provider || 'anthropic'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      const p = activeTextProvider();
      if (getKey('text', p)) { txt.textContent = 'T3 ' + (TEXT_PROVIDERS[p]?.label.split(' ')[0] || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine; STATE.ai.model = model.id; STATE.ai.ready = true; STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig(); renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();
    return t ? t : null;
  }
  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);
    return r ? r.text : null;
  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());
      body.querySelectorAll('td, th').forEach((e) => e.append(' | '));   // keep cells and blocks apart, as a reader sees them
      body.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, br, pre, dt, dd, figcaption, blockquote, section, article, header, footer, nav, label, button, option').forEach((e) => e.append('\n'));
    }
    return { title: document.title, description: d ? d.getAttribute('content') : '', text: body ? body.textContent : '' };
  }
  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };
    t.talk.push({ role: 'user', content: q }, r.assistant);
    t.last = r.text;
    return { text: r.text, why: null };
  }

  // ═══════════════════════ IMAGE · aiImage ═══════════════════════════
  async function aiImage(prompt, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.image_provider || 'fal';
    const p = IMAGE_PROVIDERS[providerKey];
    const key = getKey('image', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('image', providerKey, IMAGE_PROVIDERS);

    if (p.type === 'fal') {
      const r = await fetch('https://fal.run/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Key ' + key },
        body: JSON.stringify({ prompt, image_size: opts.size || 'landscape_4_3', num_inference_steps: opts.steps || 4 }),
      });
      if (!r.ok) throw new Error('fal ' + r.status);
      const j = await r.json();
      return { url: j.images?.[0]?.url || j.image?.url, raw: j };
    }
    if (p.type === 'hf_image') {
      const r = await fetch('https://api-inference.huggingface.co/models/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ inputs: prompt }),
      });
      if (!r.ok) throw new Error('HF ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'replicate') {
      const r = await fetch('https://api.replicate.com/v1/predictions', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Token ' + key, 'Prefer': 'wait' },
        body: JSON.stringify({ version: model, input: { prompt, num_outputs: 1 } }),
      });
      if (!r.ok) throw new Error('Replicate ' + r.status);
      const j = await r.json();
      return { url: Array.isArray(j.output) ? j.output[0] : j.output, raw: j };
    }
    if (p.type === 'openai_image') {
      const r = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1, size: opts.size || '1024x1024' }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'openai_image_compat') {
      const r = await fetch(p.url, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1 }),
      });
      if (!r.ok) throw new Error(p.label + ' ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'google_image') {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':predict?key=' + encodeURIComponent(key), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1 } }),
      });
      if (!r.ok) throw new Error('Google Imagen ' + r.status);
      const j = await r.json();
      return { url: 'data:image/png;base64,' + j.predictions[0].bytesBase64Encoded, raw: j };
    }
    if (p.type === 'ideogram') {
      const r = await fetch('https://api.ideogram.ai/generate', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Api-Key': key },
        body: JSON.stringify({ image_request: { prompt, model, aspect_ratio: opts.size || 'ASPECT_16_9' } }),
      });
      if (!r.ok) throw new Error('Ideogram ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'leonardo') {
      const r = await fetch('https://cloud.leonardo.ai/api/rest/v1/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ prompt, modelId: model, num_images: 1, width: 1024, height: 576 }),
      });
      if (!r.ok) throw new Error('Leonardo ' + r.status);
      const j = await r.json();

  // ═══════════════════════ STT · aiSTT ═══════════════════════════════
  async function aiSTT(blob, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.stt_provider || 'deepgram';
    const p = STT_PROVIDERS[providerKey];
    const key = getKey('stt', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('stt', providerKey, STT_PROVIDERS);

    if (p.type === 'deepgram') {
      const r = await fetch('https://api.deepgram.com/v1/listen?model=' + model + '&smart_format=true', {
        method: 'POST', headers: { 'Authorization': 'Token ' + key, 'content-type': blob.type || 'audio/wav' },
        body: blob,
      });
      if (!r.ok) throw new Error('Deepgram ' + r.status);
      const j = await r.json();
      return { text: j.results?.channels?.[0]?.alternatives?.[0]?.transcript, raw: j };
    }
    if (p.type === 'assemblyai') {
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method: 'POST', headers: { 'Authorization': key }, body: blob });
      const upJ = await up.json();
      const r = await fetch('https://api.assemblyai.com/v2/transcript', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': key },
        body: JSON.stringify({ audio_url: upJ.upload_url, speech_model: model }),
      });
      if (!r.ok) throw new Error('AssemblyAI ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for text' };
    }
    if (p.type === 'openai_stt') {
      const fd = new FormData();
      fd.append('file', blob, 'audio.wav');
      fd.append('model', model);
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd,
      });
      if (!r.ok) throw new Error('OpenAI Whisper ' + r.status);
      const j = await r.json();
      return { text: j.text, raw: j };
    }
    throw new Error('unknown STT provider type: ' + p.type);
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  const MESH_MODULE = '/fall-kit/core/mesh.mjs', MESH_DEVICE = '/fall-kit/core/mesh-device.mjs';
  // v3.2: the LIGHT mesh, loaded from this origin when the mesh is switched on. null = JSON, as before v3.2.
  async function lightMesh() {
    try {
      const [M, D] = await Promise.all([import(MESH_MODULE), import(MESH_DEVICE)]);
      const dev = await D.openDevice();
      const tab = crypto.getRandomValues(new Uint32Array(1))[0];
      return { M, dev, tab, seq: 0, last: new Map() };
    } catch (e) { return null; }
  }
  function meshSend(value) {
    const L = STATE.mesh.light, bc = STATE.mesh.bc;
    if (!L) { bc.postMessage(value); STATE.mesh.stats.sent++; return; }
    L.seq += 1;
    L.M.speak(value, { slot: L.dev.slot, tab: L.tab, seq: L.seq, sign: L.dev.sign }).then((r) => { if (r.ok && STATE.mesh.bc) { STATE.mesh.bc.postMessage(r.bytes); STATE.mesh.stats.sent++; } });
  }
  async function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.active = true;
    STATE.mesh.light = opts.light === false ? null : await lightMesh();
    const st = STATE.mesh.stats;
    STATE.mesh.bc.onmessage = async (e) => {
      const L = STATE.mesh.light;
      if (!L) {
        const m = e.data;
        if (!m || !m.kind || m.peerId === seedId) return;
        if (opts.onMessage) opts.onMessage(m);
        return;
      }
      const r = await L.M.hearMesh(e.data, { slot: L.dev.slot, id: L.dev.id, raw: L.dev.raw, verifyBytes: L.dev.verifyBytes, last: L.last });
      if (!r.ok) { st.refused[r.stage] = (st.refused[r.stage] || 0) + 1; return; }
      if (r.legacy) st.legacy++; else st.admitted++;
      if (r.value.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(Object.assign({}, r.value, r.legacy ? { legacy: true } : { light: true, tab: r.tab }));
    };
    meshSend({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    notify('Mesh active · channel ' + MESH_CHANNEL + (STATE.mesh.light ? ' · LIGHT' : ''), 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    meshSend({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }
  function meshStats() {
    const s = STATE.mesh.stats;
    return { active: STATE.mesh.active, light: !!STATE.mesh.light, tab: STATE.mesh.light ? STATE.mesh.light.tab : null, sent: s.sent, admitted: s.admitted, legacy: s.legacy, refused: Object.assign({}, s.refused) };
  }

  // ─── Toast ──────────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // ─── CSS for AI chip ────────────────────────────────────────────────

  // ─── The floating chip keeps clear of the build's own fixed bars and controls ─────────
  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }
    }
    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');
  }
  function placeChip(chip) {
    if (!chip || chip.dataset.anchored) return;
    chip.style.top = ''; chip.style.bottom = '14px';
    for (let i = 0; i < 6; i++) {
      const r = chip.getBoundingClientRect();
      chip.style.visibility = 'hidden';
      const hit = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2]]
        .map(([x, y]) => document.elementFromPoint(x, y)).filter(Boolean).map(blockerUnder).find(Boolean);
      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';
    }
  }

  // ─── Init ───────────────────────────────────────────────────────────

const $=(s,p=document)=>p.querySelector(s);

async function sha256(s){const buf=new TextEncoder().encode(String(s));const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

// ─── IDB ───
let db;
const STORES=['state','clients','advisers','firms','properties','tenancies','clientMoney','rentLedger','deposits','contractors','landlordDisbursements','agencyFees','salesCommission','expenses','audit'];
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(STORE,1);
  r.onupgradeneeded=e=>{const d=e.target.result;for(const s of STORES){if(!d.objectStoreNames.contains(s)){d.createObjectStore(s,{keyPath:'id'})}}};
  r.onsuccess=e=>{db=e.target.result;res(db)};
  r.onerror=()=>rej(r.error);
});}
function txStore(name,mode='readonly'){const tx=db.transaction(name,mode);return tx.objectStore(name)}
function idbPut(store,val){return new Promise(r=>{const req=txStore(store,'readwrite').put(val);req.onsuccess=()=>r(true);req.onerror=()=>r(false)})}
function idbDel(store,key){return new Promise(r=>{const req=txStore(store,'readwrite').delete(key);req.onsuccess=()=>r(true)})}
function idbGetAll(store){return new Promise(r=>{const req=txStore(store).getAll();req.onsuccess=()=>r(req.result||[]);req.onerror=()=>r([])})}
function idbGet(store,key){return new Promise(r=>{const req=txStore(store).get(key);req.onsuccess=()=>r(req.result);req.onerror=()=>r(null)})}

async function appendAudit(action,reasoning,payload){
  if(!state.settings.auditChain)return;
  const prev=state.audit.length?state.audit[state.audit.length-1]:null;
  const prevHash=prev?prev.hash:'';
  const docStr=JSON.stringify(payload||{});
  const docHash=await sha256(docStr);
  const i=(prev?prev.i:0)+1;
  const ts=Date.now();
  const hash=await sha256(prevHash+docHash+ts+i);
  const entry={id:'au_'+i+'_'+ts,i,ts,tool:TOOLNAME,configVersion:TOOLNAME+'@'+VERSION,adviserId:'',clientId:payload?.clientId||'',action,reasoning:reasoning||'',prevHash,docHash,hash,payload:payload||{}};
  state.audit.push(entry);
  if(state.audit.length>5000)state.audit=state.audit.slice(-5000);
  await idbPut('audit',entry);
}

// ─── helpers ───
function clientName(id){const c=state.clients.find(x=>x.id===id);if(!c)return id?(id.slice(0,8)+'…'):'—';return ((c.title||'')+' '+(c.firstName||'')+' '+(c.lastName||'')).trim()||c.id.slice(0,8)}

function adviserName(id){const a=state.advisers.find(x=>x.id===id);return a?a.name:id?(id.slice(0,8)+'…'):'—'}
function depositDaysLeft(dep){if(dep.protectedAt)return null;return RULES.depositProtectDays-daysBetween(dep.receivedAt,now())}
function depositStatus(dep){if(dep.protectedAt)return {cls:'green',label:'protected'};const d=depositDaysLeft(dep);if(d<=0)return {cls:'red',label:'OVERDUE'};if(d<=RULES.depositAmberDay)return {cls:'amber',label:d+'d left'};return {cls:'muted',label:d+'d left'}}
function tenancyLabel(id){const t=state.tenancies.find(x=>x.id===id);if(!t)return '—';return propAddr(t.propertyId)+' · '+clientName(t.tenantId)}

// ─── aggregation ───
function totalRentCollected(mk){return state.rentLedger.filter(r=>monthKey(r.paidDate)===mk&&r.paidDate).reduce((s,r)=>s+(+r.amount||0),0)}
function totalRentDue(mk){return state.rentLedger.filter(r=>monthKey(r.dueDate)===mk).reduce((s,r)=>s+(+r.amount||0),0)}
function totalArrears(){return state.rentLedger.filter(r=>!r.paidDate&&r.dueDate<now()).reduce((s,r)=>s+(+r.amount||0),0)}
function totalArrearsCount(){return state.rentLedger.filter(r=>!r.paidDate&&r.dueDate<now()).length}
function totalContractorPaid(mk){return state.contractors.filter(c=>c.paidAt&&monthKey(c.paidAt)===mk).reduce((s,c)=>s+(+c.amount||0),0)}
function totalAgencyFees(mk){return state.agencyFees.filter(f=>monthKey(f.date||now())===mk).reduce((s,f)=>s+(+f.amount||0),0)}
function totalSalesComm(mk){return state.salesCommission.filter(c=>c.paidAt&&monthKey(c.paidAt)===mk).reduce((s,c)=>s+((+c.salePrice||0)*(+c.agreedPct||0)/100),0)}
function totalExpenses(mk){return state.expenses.filter(x=>monthKey(x.date)===mk).reduce((s,x)=>s+(+x.amount||0),0)}
function totalLandlordDisbursed(mk){return state.landlordDisbursements.filter(d=>d.monthKey===mk).reduce((s,d)=>s+(+d.netToLandlord||0),0)}
function grossRevenue(mk){return totalAgencyFees(mk)+totalSalesComm(mk)}
function netRevenue(mk){return grossRevenue(mk)-totalExpenses(mk)}
function cmpBalance(){return state.clientMoney.reduce((s,e)=>s+((e.direction==='in'?1:-1)*(+e.amount||0)),0)}
function unprotectedDeposits(){return state.deposits.filter(d=>!d.protectedAt)}
function overdueDeposits(){return state.deposits.filter(d=>!d.protectedAt&&(now()-d.receivedAt)>RULES.depositProtectDays*dayMs)}

// ─── CMP daily reconciliation ───
function cmpLastReconciled(){const recs=state.clientMoney.filter(e=>e.type==='reconciliation');if(!recs.length)return null;return Math.max(...recs.map(e=>e.date))}
function cmpDaysSinceRecon(){const lr=cmpLastReconciled();if(!lr)return 999;return daysBetween(lr,now())}
function cmpStatus(){const d=cmpDaysSinceRecon();if(d<=1)return {cls:'green',label:'current'};if(d<=RULES.cmpAmberDays)return {cls:'amber',label:d+'d ago'};return {cls:'red',label:d+'d — overdue'}}

// ─── RENDER ───
function render(){renderTabs();const v=$('#view');switch(state.active){
  case 'dashboard':return renderDashboard(v);case 'cmp':return renderCMP(v);case 'rent':return renderRent(v);
  case 'deposits':return renderDeposits(v);case 'contractors':return renderContractors(v);case 'landlord':return renderLandlord(v);
  case 'fees':return renderFees(v);case 'sales':return renderSales(v);case 'properties':return renderProperties(v);
  case 'tenancies':return renderTenancies(v);case 'clients':return renderClients(v);case 'advisers':return renderAdvisers(v);
  case 'firm-pl':return renderFirmPL(v);case 'expenses':return renderExpenses(v);case 'qa':return renderQA(v);}}

  const annualSales=months.reduce((s,m)=>s+totalSalesComm(m),0);
  const annualExp=months.reduce((s,m)=>s+totalExpenses(m),0);
  const annualGross=annualAgency+annualSales;
  const overheads=(+state.settings.piAnnualPremium||0)+(+state.settings.cmpSchemeAnnual||0)+(+state.settings.hmrcAmlAnnual||0)+(+state.settings.propertyMarkAnnual||0);
  const annualNet=annualGross-annualExp-overheads;
  const vatLiable=annualGross>RULES.vatRegThreshold;
  v.innerHTML=`<div class="section-h"><h2>Firm P&L</h2><div class="sub">rolling 12m</div></div>
  <div class="grid" style="margin-bottom:18px">
    <div class="card"><h3>Revenue</h3>

      <div class="kpi"><span class="l">sales commission</span><span class="v">${moneyP(annualSales)}</span></div>
      <div class="kpi"><span class="l">gross revenue</span><span class="v brass">${moneyP(annualGross)}</span></div>
    </div>
    <div class="card"><h3>Costs</h3>
      <div class="kpi"><span class="l">expenses</span><span class="v">${moneyP(annualExp)}</span></div>
      <div class="kpi"><span class="l">PI insurance</span><span class="v">${moneyP(state.settings.piAnnualPremium)}</span></div>
      <div class="kpi"><span class="l">CMP scheme</span><span class="v">${moneyP(state.settings.cmpSchemeAnnual)}</span></div>
      <div class="kpi"><span class="l">HMRC AML supervision</span><span class="v">${moneyP(state.settings.hmrcAmlAnnual)}</span></div>
      <div class="kpi"><span class="l">Propertymark</span><span class="v">${moneyP(state.settings.propertyMarkAnnual)}</span></div>
      <div class="kpi"><span class="l">total overheads</span><span class="v red">${moneyP(annualExp+overheads)}</span></div>
    </div>
    <div class="card"><h3>Net</h3>
      <div class="kpi"><span class="l">net profit</span><span class="v ${annualNet>=0?'green':'red'}">${moneyP(annualNet)}</span></div>
      <div class="kpi"><span class="l">margin</span><span class="v">${annualGross>0?pct(annualNet/annualGross):'—'}</span></div>
      <div class="kpi"><span class="l">VAT threshold</span><span class="v ${vatLiable?'amber':'green'}">${vatLiable?'ABOVE — register':'below'}</span></div>
    </div>
  </div>
  <h3 style="font-family:var(--serif);margin-bottom:10px">Monthly Breakdown</h3>

}

// ─── Q&A ───
const T0_QA=[
  {q:/cmp|client money|protection/i,a:'Client Money Protection (CMP) is mandatory for letting agents in England holding client money (Client Money Protection Schemes for Property Agents (Requirement to Belong to a Scheme etc.) Regulations 2019). Key requirements: belong to an approved scheme (e.g. PropertyMark, RICS, ARLA), daily reconciliation of client account vs records, annual independent audit/inspection, minimum PI cover, client money must be in a designated client account separate from office money.'},
  {q:/deposit|30.?day|housing act 2004/i,a:'Housing Act 2004: tenancy deposits must be protected in DPS, MyDeposits, or TDS within 30 days of receipt. Prescribed Information (SI 2007/797) must also be served within 30 days. Failure penalty: 1-3× the deposit amount, and the landlord cannot serve a valid Section 21 notice. Tenant Fees Act 2019 caps deposits at 5 weeks\' rent for ASTs where annual rent <TBAk.'},
  {q:/rent.?arrears|ground.?8|s8/i,a:'Ground 8 (Housing Act 1988, Sch.2): mandatory ground for possession where at least 2 months\' rent is unpaid at the date of notice AND at the hearing. Notice period: 2 weeks minimum. Pre-action protocol: contact tenant, offer payment plans, signpost to debt advice. Section 8 notice must specify the ground(s) and particulars.'},
  {q:/agency.?fee|commission|sole|multi/i,a:'Estate agency commission structures: sole agency (typically 1-1.5% + VAT), multi-agency (2-3% + VAT), online/hybrid (fixed fee). Commission triggers on exchange of contracts (not completion). EA 1979 s.18 requires clear explanation of sole agency / sole selling rights / multi-agency terms. Agent must disclose personal interests.'},
  {q:/vat|threshold|registration/i,a:'VAT registration threshold: TBA (2025-26). Estate agents must register if taxable turnover exceeds threshold in any rolling 12-month period. Agency fees and sales commissions are standard-rated (20%). Residential rent is exempt. CMP client money is not turnover. Management fees charged to landlords are standard-rated.'},
  {q:/landlord.?statement|disbursement/i,a:'Monthly landlord statement should show: rent collected, agency management fee (deducted), maintenance costs (deducted from client account with landlord authority), VAT on fees, net amount remitted to landlord. CMP rules require: payments from client account only for authorised purposes, clear records, no commingling with office funds.'},
  {q:/pi|insurance|professional.?indemnity/i,a:'PI (Professional Indemnity) insurance is required for CMP scheme membership and PropertyMark/ARLA membership. Typical minimum cover: TBAk per single claim. CMP schemes require the agent to maintain adequate PI. RICS firms need minimum TBAk. Check your scheme\'s specific requirements. PI covers negligence, errors, and omissions.'},
  {q:/redress|tpo|prs|ombudsman/i,a:'Property redress scheme membership is mandatory (Enterprise & Regulatory Reform Act 2013). Approved schemes: Property Ombudsman (TPO) and Property Redress Scheme (PRS). Penalty for non-membership: up to TBA. Both lettings and sales activities require membership. Complaints must be handled via internal complaints procedure first, then referred to the scheme.'},
  {q:/aml|money.?laundering|mlr/i,a:'MLR 2017 applies to estate agents in property transactions. CDD required for all parties. High-value properties and cash transactions are higher risk. HMRC is the supervisory authority (not FCA). Agents must: register with HMRC, conduct risk assessments, apply CDD, report suspicious activity (SAR to NCA), keep records for 5 years. Annual supervision fee ~TBA per premise.'},
  {q:/inspection|inventory|check.?out/i,a:'Inventory and inspection best practice: detailed check-in inventory (room-by-room condition, meter readings, photos), periodic inspections (typically quarterly), check-out inventory. For deposit disputes: inventory is primary evidence. ADR schemes (DPS/MyDeposits/TDS) rely heavily on the quality of the inventory. Mid-tenancy inspections require 24 hours\' written notice.'}];
function askT0(q){for(const r of T0_QA){if(r.q.test(q))return {answer:r.a,source:'T0 · UK estate/letting rules'};}return null}
async function askT3(q){if(!state.settings.anthropicKey)return null;try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'You are a UK estate & letting agent accounting expert. CMP, deposits, rent, commission, VAT. Concise answer.\n\n'+q}]})});if(!res.ok)return null;const j=await res.json();return {answer:j.content?.[0]?.text,source:'T3 · Anthropic'}}catch(e){return null}}

function renderQA(v){
  v.innerHTML=`<div class="section-h"><h2>Q & A</h2><div class="sub">T0 + T3 BYOK</div></div>
  <div class="card" style="max-width:780px">
    <div class="chat" id="chatBox">${(state.chat||[]).map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div>
    <div class="chat-input"><input id="chatIn" placeholder="Ask… 'CMP daily reconciliation?' · '30-day deposit rule?'" onkeydown="if(event.key==='Enter')askQuestion()"><button class="btn brass" onclick="askQuestion()">Ask</button></div>
  </div>`;
  const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight;
}
async function askQuestion(){const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';if(!state.chat)state.chat=[];state.chat.push({role:'user',text:q});render();let r=askT0(q);if(!r)r=await askT3(q);state.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add BYOK key in Settings for T3.',source:'system'});saveState();render();}

function exportAll(){const d={tool:TOOLNAME,v:VERSION,ts:now(),firm:state.firm,clients:state.clients,advisers:state.advisers,properties:state.properties,tenancies:state.tenancies,clientMoney:state.clientMoney,rentLedger:state.rentLedger,deposits:state.deposits,contractors:state.contractors,landlordDisbursements:state.landlordDisbursements,agencyFees:state.agencyFees,salesCommission:state.salesCommission,expenses:state.expenses};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='fallestatepractice-export.json';a.click();URL.revokeObjectURL(u);toast('Exported')}
function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm)}for(const k of['clients','advisers','properties','tenancies','clientMoney','rentLedger','deposits','contractors','landlordDisbursements','agencyFees','salesCommission','expenses']){if(Array.isArray(d[k]))for(const r of d[k]){state[k].push(r);await idbPut(k,r)}}toast('Imported');render()}catch(e){toast('Import failed')}};inp.click()}
async function wipeAll(){if(!confirm('Wipe ALL data?'))return;for(const s of STORES){try{const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r})}catch(e){}}location.reload()}

async function saveFirmForm(){const f=state.firm||{id:uid('fi'),ts:now()};f.name=$('#fName').value.trim();f.email=$('#fEmail').value.trim();f.address=$('#fAddr').value.trim();f.phone=$('#fPhone').value.trim();f.hmrcAmlRef=$('#fAml').value.trim();f.redressScheme=$('#fRedress').value;f.updatedAt=now();state.firm=f;await idbPut('firms',f);await appendAudit('firm.saved');toast('Saved');render()}
